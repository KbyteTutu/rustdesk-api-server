lang: "zh-CN"
app:
  web-client: 1  # 1:启用 0:禁用
  register: false #是否开启注册
  register-status: 1 # 注册用户默认状态 1:启用 2:禁用
  captcha-threshold: 3 #   <0:disabled, 0 always, >0:enabled
  ban-threshold: 0 # 0:disabled, >0:enabled
  show-swagger: 0 # 1:启用 0:禁用
  token-expire: 168h
  web-sso: true #web auth sso
  disable-pwd-login: false #禁用密码登录

admin:
  title: "RustDesk 控制台 · Kbytetutu fork"
  hello-file: ""  # 欢迎信息只按纯文本显示，不执行 HTML/Markdown
  hello: ""
  # Empty disables control commands. Configure private Unix sockets on Linux.
  id-server-socket: ""
  relay-server-socket: ""
gin:
  api-addr: "0.0.0.0:21114"
  mode: "release" #release,debug,test
  resources-path: 'resources'  #对外静态文件目录
  trust-proxy: ""
gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100
mysql:
  username: ""
  password: ""
  addr: ""
  dbname: ""
  tls: "false" # true / false / skip-verify / custom

postgresql:
  host: "127.0.0.1"
  port: "5432"
  user: ""
  password: ""
  dbname: "postgres"
  sslmode: "disable" # disable, require, verify-ca, verify-full
  time-zone: "Asia/Shanghai" # Time zone for PostgreSQL connection

rustdesk:
  id-server: "192.168.1.66:21116"
  relay-server: "192.168.1.66:21117"
  api-server: "http://127.0.0.1:21114"
  key: ""
  key-file: "/data/id_ed25519.pub"
  personal: 1
  webclient-magic-queryonline: 0
  ws-host: ""  #eg: wss://192.168.1.3:4443
logger:
  level: "info" #trace,debug,info,warn,error,fatal
  report-caller: true
proxy:
  enable: false
  host: "http://127.0.0.1:1080"
jwt:
  key: ""
ldap:
  enable: false
  url: "ldaps://ldap.example.com:636"
  tls-ca-file: ""
  tls-verify: true
  base-dn: "dc=example,dc=com"
  bind-dn: "cn=admin,dc=example,dc=com"
  bind-password: "password"

  user:
    base-dn: "ou=users,dc=example,dc=com"
    # AD: ACCOUNTDISABLE is enforced. Non-AD: set status attribute/value.
    enable-attr: "userAccountControl"
    enable-attr-value: ""
    filter: "(cn=*)"
    username: "uid"  # AD uses sAMAccountName.
    email: "mail"
    first-name: "givenName"
    last-name: "sn"
    sync: false  # Sync existing LDAP accounts at login.
    admin-group: "cn=admin,dc=example,dc=com"
    allow-group: "cn=users,dc=example,dc=com"
