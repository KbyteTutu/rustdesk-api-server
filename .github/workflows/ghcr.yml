name: Build and publish docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    name: Build rust - ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   os: ubuntu-24.04, target: "x86_64-unknown-linux-musl",  docker_arch: "amd64" }
          - { name: "arm64v8", os: ubuntu-24.04, target: "aarch64-unknown-linux-musl", docker_arch: "arm64" }
          - { name: "armv7",   os: ubuntu-24.04, target: "armv7-unknown-linux-musleabihf", docker_arch: "arm" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: rustdesk-server
          key: ${{ matrix.job.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}

      - name: List binaries
        run: ls -l target/${{ matrix.job.target }}/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils

  images:
    name: Docker image - ${{ matrix.image }}
    needs: build-rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [hbbs, hbbr, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rust binaries
        if: matrix.image != 'api'
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-linux-*
          path: docker/bin

      - name: Arrange binaries per architecture
        if: matrix.image != 'api'
        run: |
          mkdir -p docker/bin/stage
          mv docker/bin/binaries-linux-amd64   docker/bin/amd64
          mv docker/bin/binaries-linux-arm64v8 docker/bin/arm64
          mv docker/bin/binaries-linux-armv7   docker/bin/arm
          chmod -Rv a+x docker/bin/stage

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image name and tag
        run: |
          T="${GITHUB_REF#refs/*/}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then T="latest"; fi
          T="${T#v}"
          M=$(echo "$T" | cut -d. -f1-2)
          if [[ "$T" == "latest" ]]; then M="latest"; fi
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          echo "IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/rustdesk-${{ matrix.image }}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          build-args: |
            API_VERSION=${{ env.GIT_TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.GIT_TAG }}
            ${{ env.IMAGE }}:${{ env.MAJOR_TAG }}
            ${{ env.IMAGE }}:latest
