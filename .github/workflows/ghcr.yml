name: Build and publish docker images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-rust:
    name: Build rust - ${{ matrix.job.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   platform: "linux/amd64", docker_arch: "amd64" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build (rust:alpine, musl native per arch)
        run: |
          docker run --rm --platform ${{ matrix.job.platform }} \
            -v "$PWD":/src -w /src rust:alpine \
            sh -c "apk add --no-cache protoc musl-dev make perl >/dev/null && cargo build --release"

      - name: List binaries
        run: ls -l target/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/release/hbbr
            target/release/hbbs
            target/release/rustdesk-utils

  images:
    name: Docker image - ${{ matrix.image }}
    needs: build-rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [hbbs, hbbr, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rust binaries
        if: matrix.image != 'api'
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-linux-*
          path: docker/bin

      - name: Arrange binaries per architecture
        if: matrix.image != 'api'
        run: |
          mv docker/bin/binaries-linux-amd64 docker/bin/amd64
          chmod -Rv a+x docker/bin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image name and tag
        run: |
          T="${GITHUB_REF#refs/*/}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then T="latest"; fi
          T="${T#v}"
          M=$(echo "$T" | cut -d. -f1-2)
          if [[ "$T" == "latest" ]]; then M="latest"; fi
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          echo "IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/rustdesk-${{ matrix.image }}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            API_VERSION=${{ env.GIT_TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.GIT_TAG }}
            ${{ env.IMAGE }}:${{ env.MAJOR_TAG }}
            ${{ env.IMAGE }}:latest
